<!DOCTYPE html>
<html lang="en" class="dark style-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results | Solarglyph Labs</title>
    <link rel="icon" href="https://www.solarglyphlabs.com/images/Logo/SolarglyphLabsLogoCut.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>

    <!-- Solarglyph Brand Scripts -->
    <script src="/shared/theme-config.js"></script>
    <link rel="stylesheet" href="/shared/styles.css">
    <script src="/shared/components.js" defer></script>

    <style>
        :root { --mono: 'JetBrains Mono', ui-monospace, monospace; }
        .mono { font-family: var(--mono); }
        
        pre::-webkit-scrollbar { width: 8px; height: 8px; }
        pre::-webkit-scrollbar-track { background: transparent; }
        pre::-webkit-scrollbar-thumb { background: rgba(120,130,150,0.2); border-radius: 4px; }
        pre::-webkit-scrollbar-thumb:hover { background: rgba(120,130,150,0.4); }
    </style>
</head>
<body class="text-apple-textLight dark:text-apple-textDark transition-colors duration-500 overflow-x-hidden relative flex flex-col min-h-screen">
    
    <!-- Brand Background -->
    <div class="fixed inset-0 z-[-2] bg-cover bg-center" style="background-image: url('https://www.solarglyphlabs.com/images/Backgrounds/SolarGlyphCampus.png');"></div>
    <div class="fixed inset-0 z-[-1] bg-white/80 dark:bg-black/75 backdrop-blur-[24px] transition-colors duration-500"></div>

    <site-nav page="tool"></site-nav>

    <main class="relative z-10 flex-1 w-full max-w-6xl mx-auto pt-28 pb-40 px-4 flex flex-col reveal active">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-4">
                <a href="index.html" class="glass-card rounded-full p-2.5 flex items-center justify-center border border-gray-300/40 dark:border-white/10 hover:bg-white/40 dark:hover:bg-white/10 transition-colors shadow-sm text-gray-500 hover:text-apple-textLight dark:hover:text-white" title="Back to Editor">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight mb-1 flex items-center gap-2">
                        <i data-lucide="check-circle-2" class="w-6 h-6 text-green-500"></i> Obfuscation Complete
                    </h1>
                    <p class="text-gray-600 dark:text-gray-400 text-sm">Your scripts have been successfully secured.</p>
                </div>
            </div>
            <div class="flex gap-3">
                <button id="copy-all-btn" class="glass-card rounded-xl px-5 py-2.5 text-sm font-medium flex items-center gap-2 border border-gray-300/40 dark:border-white/10 hover:bg-white/40 dark:hover:bg-white/10 transition-colors shadow-sm">
                    <i data-lucide="copy" class="w-4 h-4"></i> Copy All
                </button>
                <button id="export-all-btn" class="bg-solarglyph dark:bg-blue-600 text-white rounded-xl px-5 py-2.5 text-sm font-medium flex items-center gap-2 shadow-[0_4px_14px_rgba(37,99,235,0.2)] hover:-translate-y-0.5 transition-all">
                    <i data-lucide="download" class="w-4 h-4"></i> Download ZIP
                </button>
            </div>
        </div>

        <!-- Results Container -->
        <div id="results-container" class="space-y-8">
            <!-- Dynamically populated -->
        </div>
        
    </main>

    <site-footer></site-footer>

    <script src="/shared/site.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resultsData = sessionStorage.getItem('sg_current_results');
            if (!resultsData) {
                document.getElementById('results-container').innerHTML = `
                    <div class="glass-card rounded-[2rem] p-12 text-center border border-gray-300/40 dark:border-white/10 shadow-lg">
                        <i data-lucide="folder-x" class="w-12 h-12 text-gray-400 mx-auto mb-4"></i>
                        <h2 class="text-lg font-medium mb-2">No results found</h2>
                        <p class="text-gray-500 dark:text-gray-400 text-sm mb-6">It looks like you haven't obfuscated any scripts yet in this session.</p>
                        <a href="index.html" class="inline-flex items-center gap-2 text-sm text-solarglyph dark:text-blue-400 hover:underline">
                            Return to Editor <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </a>
                    </div>
                `;
                if (window.lucide) lucide.createIcons();
                return;
            }

            const results = JSON.parse(resultsData);
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            // Generate Side-by-Side Views
            results.forEach((r, index) => {
                const section = document.createElement('div');
                section.className = "glass-card rounded-[2rem] overflow-hidden border border-gray-300/40 dark:border-white/10 shadow-lg";
                
                section.innerHTML = `
                    <div class="bg-white/40 dark:bg-black/30 px-6 py-4 border-b border-gray-300/40 dark:border-white/10 flex justify-between items-center">
                        <span class="font-semibold text-[15px] mono flex items-center gap-2">
                            <i data-lucide="file-code-2" class="w-4 h-4 text-solarglyph dark:text-blue-400"></i> ${r.name}
                        </span>
                        <button class="copy-single-btn px-4 py-2 text-xs font-semibold uppercase tracking-wide border border-gray-300/50 dark:border-white/10 rounded-lg bg-white/50 dark:bg-white/5 hover:bg-white/80 dark:hover:bg-white/10 flex items-center gap-1.5 transition-colors text-gray-600 dark:text-gray-300" data-index="${index}">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy Script
                        </button>
                    </div>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-2 divide-y lg:divide-y-0 lg:divide-x divide-gray-300/40 dark:divide-white/10">
                        <!-- Original -->
                        <div class="flex flex-col bg-gray-50/30 dark:bg-black/10">
                            <div class="px-5 py-2.5 text-[10px] uppercase tracking-widest font-semibold text-gray-500 border-b border-gray-300/40 dark:border-white/10 bg-white/20 dark:bg-white/[0.02]">Original Input</div>
                            <pre class="p-5 text-[13px] leading-relaxed mono text-gray-600 dark:text-gray-400 overflow-auto h-[450px]">${r.original.replace(/</g, '&lt;')}</pre>
                        </div>
                        <!-- Output -->
                        <div class="flex flex-col bg-white/10 dark:bg-[#0a0a0c]/40">
                            <div class="px-5 py-2.5 text-[10px] uppercase tracking-widest font-bold text-solarglyph dark:text-blue-400 border-b border-gray-300/40 dark:border-white/10 bg-solarglyph/5 dark:bg-blue-500/5">Secured Output</div>
                            <pre class="p-5 text-[13px] leading-relaxed mono text-gray-800 dark:text-gray-200 overflow-auto h-[450px]">${r.output.replace(/</g, '&lt;')}</pre>
                        </div>
                    </div>
                `;
                container.appendChild(section);
            });

            if (window.lucide) lucide.createIcons();

            // Interactivity: Copy Single
            document.querySelectorAll('.copy-single-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const idx = e.currentTarget.getAttribute('data-index');
                    const text = results[idx].output;
                    try {
                        await navigator.clipboard.writeText(text);
                        const orig = e.currentTarget.innerHTML;
                        e.currentTarget.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-green-500"></i> <span class="text-green-500">Copied</span>`;
                        e.currentTarget.classList.add('border-green-500/30', 'bg-green-500/10');
                        if (window.lucide) lucide.createIcons();
                        setTimeout(() => { 
                            e.currentTarget.innerHTML = orig; 
                            e.currentTarget.classList.remove('border-green-500/30', 'bg-green-500/10');
                            if (window.lucide) lucide.createIcons(); 
                        }, 2000);
                    } catch(err) { console.error(err); }
                });
            });

            // Interactivity: Copy All
            document.getElementById('copy-all-btn').addEventListener('click', async (e) => {
                const combined = results.map(r => `-- ${r.name}\n${r.output}`).join('\n\n');
                try {
                    await navigator.clipboard.writeText(combined);
                    const orig = e.currentTarget.innerHTML;
                    e.currentTarget.innerHTML = `<i data-lucide="check" class="w-4 h-4 text-green-500"></i> <span class="text-green-500">Copied All</span>`;
                    e.currentTarget.classList.add('border-green-500/30', 'text-green-600', 'dark:text-green-400');
                    if (window.lucide) lucide.createIcons();
                    setTimeout(() => { 
                        e.currentTarget.innerHTML = orig; 
                        e.currentTarget.classList.remove('border-green-500/30', 'text-green-600', 'dark:text-green-400');
                        if (window.lucide) lucide.createIcons(); 
                    }, 2000);
                } catch(err) { console.error(err); }
            });

            // Interactivity: Download ZIP
            document.getElementById('export-all-btn').addEventListener('click', async () => {
                if (!results.length) return;
                if (results.length === 1) {
                    const r = results[0];
                    const blob = new Blob([r.output], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = r.name.replace(/\.(lua|luau|txt)$/i, '') + '.obfuscated.lua'; a.click(); URL.revokeObjectURL(url);
                    return;
                }
                const zip = new JSZip();
                results.forEach(r => zip.file(r.name.replace(/\.(lua|luau|txt)$/i, '') + '.obfuscated.lua', r.output));
                const blob = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'obfuscated_batch.zip'; a.click(); URL.revokeObjectURL(url);
            });
        });
    </script>
</body>
</html>
