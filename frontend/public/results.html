<!DOCTYPE html>
<html lang="en" class="dark style-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results | Solarglyph Labs</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { --mono: 'JetBrains Mono', ui-monospace, monospace; }
        .mono { font-family: var(--mono); }
    </style>
</head>
<body class="text-gray-800 dark:text-gray-200 bg-gray-50 dark:bg-[#0a0a0c] min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-gray-200 dark:border-white/10 bg-white dark:bg-[#121214] px-6 py-4 flex items-center justify-between sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <a href="index.html" class="p-2 hover:bg-gray-100 dark:hover:bg-white/5 rounded-lg text-gray-500 transition-colors">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div>
                <h1 class="text-lg font-semibold flex items-center gap-2">
                    <i data-lucide="check-circle-2" class="w-5 h-5 text-green-500"></i> Obfuscation Complete
                </h1>
                <p class="text-xs text-gray-500">Your scripts have been processed successfully.</p>
            </div>
        </div>
        <div class="flex gap-3">
            <button id="copy-all-btn" class="px-4 py-2 bg-gray-100 dark:bg-white/5 hover:bg-gray-200 dark:hover:bg-white/10 border border-gray-200 dark:border-white/10 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                <i data-lucide="copy" class="w-4 h-4"></i> Copy All
            </button>
            <button class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                <i data-lucide="download" class="w-4 h-4"></i> Download ZIP
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-[1400px] w-full mx-auto p-6">
        <div id="results-container" class="space-y-8">
            <!-- Injected by JS -->
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resultsData = sessionStorage.getItem('sg_current_results');
            if (!resultsData) {
                document.getElementById('results-container').innerHTML = `
                    <div class="text-center py-20 text-gray-500">
                        <p>No results found in session.</p>
                        <a href="index.html" class="text-blue-500 hover:underline mt-2 inline-block">Return to Editor</a>
                    </div>
                `;
                return;
            }

            const results = JSON.parse(resultsData);
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            results.forEach((r, index) => {
                const section = document.createElement('div');
                section.className = "bg-white dark:bg-[#121214] border border-gray-200 dark:border-white/10 rounded-xl overflow-hidden shadow-sm";
                
                // Grid creates a side-by-side layout on desktop, stacked on mobile
                section.innerHTML = `
                    <div class="bg-gray-50 dark:bg-black/20 px-4 py-3 border-b border-gray-200 dark:border-white/10 flex justify-between items-center">
                        <span class="font-medium text-sm mono flex items-center gap-2">
                            <i data-lucide="file-code" class="w-4 h-4 text-blue-500"></i> ${r.name}
                        </span>
                        <button class="copy-single-btn px-3 py-1.5 text-xs font-medium border border-gray-200 dark:border-white/10 rounded bg-white dark:bg-white/5 hover:bg-gray-50 dark:hover:bg-white/10 flex items-center gap-1.5 transition-colors" data-index="${index}">
                            <i data-lucide="copy" class="w-3 h-3"></i> Copy Output
                        </button>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 divide-y lg:divide-y-0 lg:divide-x divide-gray-200 dark:divide-white/10">
                        <!-- Original -->
                        <div class="flex flex-col">
                            <div class="px-4 py-2 text-[10px] uppercase tracking-wider text-gray-500 bg-gray-50/50 dark:bg-black/10 border-b border-gray-200 dark:border-white/10">Original Input</div>
                            <pre class="p-4 text-xs mono text-gray-600 dark:text-gray-400 overflow-auto max-h-[400px]">${r.original.replace(/</g, '&lt;')}</pre>
                        </div>
                        <!-- Output -->
                        <div class="flex flex-col">
                            <div class="px-4 py-2 text-[10px] uppercase tracking-wider text-blue-600 dark:text-blue-400 font-semibold bg-blue-50 dark:bg-blue-900/10 border-b border-gray-200 dark:border-white/10">Obfuscated Output</div>
                            <pre class="p-4 text-xs mono text-gray-800 dark:text-gray-200 overflow-auto max-h-[400px]">${r.output.replace(/</g, '&lt;')}</pre>
                        </div>
                    </div>
                `;
                container.appendChild(section);
            });

            if (window.lucide) lucide.createIcons();

            // Copy Single
            document.querySelectorAll('.copy-single-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const idx = e.currentTarget.getAttribute('data-index');
                    const text = results[idx].output;
                    await navigator.clipboard.writeText(text);
                    const orig = e.currentTarget.innerHTML;
                    e.currentTarget.innerHTML = `<i data-lucide="check" class="w-3 h-3 text-green-500"></i> <span class="text-green-500">Copied</span>`;
                    if (window.lucide) lucide.createIcons();
                    setTimeout(() => { e.currentTarget.innerHTML = orig; if (window.lucide) lucide.createIcons(); }, 2000);
                });
            });

            // Copy All
            document.getElementById('copy-all-btn').addEventListener('click', async (e) => {
                const combined = results.map(r => `-- ${r.name}\n${r.output}`).join('\n\n');
                await navigator.clipboard.writeText(combined);
                const orig = e.currentTarget.innerHTML;
                e.currentTarget.innerHTML = `<i data-lucide="check" class="w-4 h-4 text-green-500"></i> <span class="text-green-500">Copied All</span>`;
                if (window.lucide) lucide.createIcons();
                setTimeout(() => { e.currentTarget.innerHTML = orig; if (window.lucide) lucide.createIcons(); }, 2000);
            });
        });
    </script>
</body>
</html>
