<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In (demo)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 20px; color: #111; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; margin-bottom: 24px; font-size: 14px; }
  label { display: block; font-size: 13px; margin-bottom: 4px; margin-top: 14px; font-weight: 600; }
  input { width: 100%; padding: 8px 10px; font-size: 14px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  button { margin-top: 18px; width: 100%; padding: 10px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #111; color: #fff; }
  button.oauth { background: #fff; color: #111; border: 1px solid #ccc; margin-top: 8px; }
  button:disabled { opacity: 0.5; cursor: default; }
  #error { display: none; margin-top: 14px; padding: 8px 10px; background: #fee; border: 1px solid #f99; color: #900; font-size: 13px; border-radius: 4px; }
  hr { margin: 20px 0; border: none; border-top: 1px solid #ddd; }
  a { color: #06c; }
</style>
</head>
<body>

  <h1>Log in — demo</h1>
  <p class="sub">Unstyled test page — verifies the Supabase call before this gets themed.</p>

  <button class="oauth" id="discord-btn">Continue with Discord</button>
  <button class="oauth" id="github-btn">Continue with GitHub</button>

  <hr>

  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password">

    <button type="submit" id="login-btn">Log In</button>
  </form>

  <div id="error"></div>

  <p style="margin-top:20px; font-size:13px;">No account? <a href="/signup.html">Sign up</a></p>

<script>
        const SUPABASE_URL = 'https://xuhohaetbviveewgeiub.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_V_h9hhxlQ_xH4WaNZrh9Wg_7Tt0nDbb';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('login-form');
  const btn = document.getElementById('login-btn');
  const errorBox = document.getElementById('error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Logging in...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    btn.disabled = false;
    btn.textContent = 'Log In';

    if (error) {
      errorBox.textContent = error.message;
      errorBox.style.display = 'block';
      return;
    }

    window.location.href = '/dashboard-demo.html';
  });

  document.getElementById('discord-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signInWithOAuth({
      provider: 'discord',
      options: { redirectTo: `${window.location.origin}/dashboard-demo.html` }
    });
  });

  document.getElementById('github-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signInWithOAuth({
      provider: 'github',
      options: { redirectTo: `${window.location.origin}/dashboard-demo.html` }
    });
  });
</script>

</body>
</html>
