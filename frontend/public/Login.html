<!DOCTYPE html>
<html lang="en" class="dark style-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Solarglyph Labs</title>
    <link rel="icon" href="https://www.solarglyphlabs.com/images/Logo/SolarglyphLabsLogoCut.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="/shared/theme-config.js"></script>
    <link rel="stylesheet" href="/shared/styles.css">
    <script src="/shared/components.js" defer></script>

    <!-- Supabase client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="text-apple-textLight dark:text-apple-textDark transition-colors duration-500 overflow-x-hidden">
    <div class="fixed inset-0 z-[-2] bg-cover bg-center" style="background-image: url('https://www.solarglyphlabs.com/images/Backgrounds/SolarGlyphCampus.png');"></div>
    <div class="fixed inset-0 z-[-1] bg-white/80 dark:bg-black/75 backdrop-blur-[24px] transition-colors duration-500"></div>

    <site-nav></site-nav>

    <main class="relative z-10 min-h-screen flex items-center justify-center px-4 pt-24 pb-16">
        <div class="w-full max-w-md">

            <div class="text-center mb-8 reveal active">
                <img src="https://www.solarglyphlabs.com/images/Logo/SolarglyphLabsLogoCut.png" alt="" class="w-10 h-10 mx-auto mb-4 opacity-90">
                <h1 class="text-3xl font-bold tracking-tight mb-2">Welcome back</h1>
                <p class="text-gray-600 dark:text-gray-400">Log in to obfuscate your scripts.</p>
            </div>

            <div class="glass-card rounded-[2rem] p-8 md:p-10 reveal active">
                <div id="form-error" class="hidden mb-5 text-sm text-red-600 dark:text-red-400 bg-red-500/10 border border-red-500/20 rounded-xl px-4 py-3"></div>

                <form id="login-form" class="space-y-5">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email</label>
                        <input type="email" id="email" required autocomplete="email"
                            class="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-black/30 border border-gray-300/50 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-solarglyph dark:focus:ring-blue-400 transition-all text-apple-textLight dark:text-apple-textDark"
                            placeholder="you@example.com">
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
                            <a href="/reset-password.html" class="text-xs font-medium text-solarglyph dark:text-blue-400 hover:underline">Forgot password?</a>
                        </div>
                        <input type="password" id="password" required autocomplete="current-password"
                            class="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-black/30 border border-gray-300/50 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-solarglyph dark:focus:ring-blue-400 transition-all text-apple-textLight dark:text-apple-textDark"
                            placeholder="••••••••">
                    </div>

                    <button type="submit" id="login-btn"
                        class="w-full flex items-center justify-center gap-2 bg-solarglyph text-white font-medium px-6 py-3.5 rounded-full hover:shadow-lg hover:shadow-solarglyph/30 hover:-translate-y-px transition-all duration-300">
                        <i data-lucide="loader-2" class="w-4 h-4 spin hidden" id="login-spinner"></i>
                        <span id="login-label">Log In</span>
                    </button>
                </form>
            </div>

            <p class="text-center text-sm text-gray-600 dark:text-gray-400 mt-6 reveal active">
                Don't have an account?
                <a href="/Signup.html" class="font-medium text-solarglyph dark:text-blue-400 hover:underline">Sign up</a>
            </p>

        </div>
    </main>

    <site-footer></site-footer>

    <script src="/shared/site.js"></script>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; }
    </style>
    <script>
        // ---- Supabase config: fill these in with your project's values ----
        const SUPABASE_URL = 'https://xuhohaetbviveewgeiub.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_V_h9hhxlQ_xH4WaNZrh9Wg_7Tt0nDbb';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('form-error');
        const btn = document.getElementById('login-btn');
        const spinner = document.getElementById('login-spinner');
        const label = document.getElementById('login-label');

        function setLoading(isLoading) {
            btn.disabled = isLoading;
            spinner.classList.toggle('hidden', !isLoading);
            label.textContent = isLoading ? 'Logging in...' : 'Log In';
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.remove('hidden');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            setLoading(true);

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            setLoading(false);

            if (error) {
                showError(error.message || 'Could not log in. Check your email and password.');
                return;
            }

            // Successful login — send them to the dashboard
            window.location.href = '/Dashboard.html';
        });
    </script>
</body>
</html>
