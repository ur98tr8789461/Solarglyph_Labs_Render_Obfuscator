<script>

    lucide.createIcons();


    /* =========================================================
       PARTICLE 501
       Based directly on the existing SolarGlyph 404 effect.
    ========================================================= */

    document.addEventListener("DOMContentLoaded", () => {

        const canvas =
            document.getElementById("particleCanvas");

        const ctx =
            canvas.getContext("2d", {
                willReadFrequently: true
            });


        let canvasWidth =
            canvas.offsetWidth;

        let canvasHeight =
            canvas.offsetHeight;


        canvas.width = canvasWidth;
        canvas.height = canvasHeight;


        let particlesArray = [];


        /* -----------------------------------------------------
           Mouse interaction
        ----------------------------------------------------- */

        const mouse = {
            x: null,
            y: null,
            radius: 100
        };


        let canvasPosition =
            canvas.getBoundingClientRect();


        window.addEventListener("mousemove", (event) => {

            mouse.x =
                event.clientX -
                canvasPosition.left;

            mouse.y =
                event.clientY -
                canvasPosition.top;

        });


        canvas.addEventListener("mouseleave", () => {

            mouse.x = undefined;
            mouse.y = undefined;

        });


        window.addEventListener("resize", () => {

            canvasPosition =
                canvas.getBoundingClientRect();

            canvasWidth =
                canvas.offsetWidth;

            canvasHeight =
                canvas.offsetHeight;

            canvas.width =
                canvasWidth;

            canvas.height =
                canvasHeight;

            init();

        });


        window.addEventListener("scroll", () => {

            canvasPosition =
                canvas.getBoundingClientRect();

        });


        /* -----------------------------------------------------
           SolarGlyph particle colours

           Same blue family as the existing 404.
        ----------------------------------------------------- */

        const brandColors = [

            "rgba(59, 130, 246, 0.90)",
            "rgba(96, 165, 250, 0.80)",
            "rgba(37, 99, 235, 0.90)"

        ];


        /* -----------------------------------------------------
           Particle
        ----------------------------------------------------- */

        class Particle {

            constructor(x, y) {

                this.x =
                    x +
                    Math.random() * 400 -
                    200;

                this.y =
                    y +
                    Math.random() * 400 -
                    200;


                this.size =
                    Math.random() * 2 +
                    1;


                this.baseX = x;
                this.baseY = y;


                this.density =
                    Math.random() * 40 +
                    5;


                this.vx = 0;
                this.vy = 0;


                this.color =
                    brandColors[
                        Math.floor(
                            Math.random() *
                            brandColors.length
                        )
                    ];

            }


            draw() {

                ctx.fillStyle =
                    this.color;


                ctx.beginPath();

                ctx.arc(
                    this.x,
                    this.y,
                    this.size,
                    0,
                    Math.PI * 2
                );

                ctx.closePath();

                ctx.fill();

            }


            update() {

                if (
                    mouse.x !== undefined &&
                    mouse.y !== undefined
                ) {

                    const dx =
                        mouse.x -
                        this.x;

                    const dy =
                        mouse.y -
                        this.y;

                    const distance =
                        Math.sqrt(
                            dx * dx +
                            dy * dy
                        );


                    if (
                        distance <
                        mouse.radius &&
                        distance > 0
                    ) {

                        const force =
                            (mouse.radius -
                                distance) /
                            mouse.radius;


                        const directionX =
                            dx / distance;

                        const directionY =
                            dy / distance;


                        this.vx -=
                            directionX *
                            force *
                            this.density;

                        this.vy -=
                            directionY *
                            force *
                            this.density;

                    }

                }


                /* Return particles to their 501 positions */

                const dxBase =
                    this.baseX -
                    this.x;

                const dyBase =
                    this.baseY -
                    this.y;


                this.vx +=
                    dxBase *
                    0.05;

                this.vy +=
                    dyBase *
                    0.05;


                this.vx *= 0.85;
                this.vy *= 0.85;


                this.x += this.vx;
                this.y += this.vy;


                /* Very small idle movement */

                if (
                    Math.abs(this.vx) < 0.1 &&
                    Math.abs(this.vy) < 0.1 &&
                    mouse.x === undefined
                ) {

                    this.x +=
                        Math.sin(
                            Date.now() * 0.001 +
                            this.baseX
                        ) * 0.2;

                    this.y +=
                        Math.cos(
                            Date.now() * 0.002 +
                            this.baseY
                        ) * 0.2;

                }

            }

        }


        /* -----------------------------------------------------
           Create the 501 particle shape
        ----------------------------------------------------- */

        function init() {

            particlesArray = [];

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.fillStyle =
                "white";


            /*
             * Scale the code differently from desktop 404
             * because this page is specifically mobile.
             */

            const fontSize =
                Math.min(
                    canvas.width * 0.55,
                    canvas.height * 0.82,
                    205
                );


            ctx.font =
                `800 ${fontSize}px 'Plus Jakarta Sans', system-ui, sans-serif`;


            ctx.textAlign =
                "center";


            ctx.textBaseline =
                "middle";


            /* THIS IS THE IMPORTANT CHANGE */

            ctx.fillText(
                "501",
                canvas.width / 2,
                canvas.height / 2
            );


            const textCoordinates =
                ctx.getImageData(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * Same sampling approach as the real 404.
             */

            const step = 4;


            for (
                let y = 0;
                y < textCoordinates.height;
                y += step
            ) {

                for (
                    let x = 0;
                    x < textCoordinates.width;
                    x += step
                ) {

                    const index =
                        (
                            y *
                            4 *
                            textCoordinates.width
                        ) +
                        (
                            x * 4
                        ) +
                        3;


                    if (
                        textCoordinates.data[index] >
                        128
                    ) {

                        particlesArray.push(
                            new Particle(x, y)
                        );

                    }

                }

            }

        }


        /* -----------------------------------------------------
           Animation loop
        ----------------------------------------------------- */

        function animate() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            for (
                let i = 0;
                i < particlesArray.length;
                i++
            ) {

                particlesArray[i].draw();
                particlesArray[i].update();

            }


            requestAnimationFrame(
                animate
            );

        }


        /*
         * Give the page time to finish layout first.
         */

        setTimeout(() => {

            init();
            animate();

        }, 150);

    });

</script>
