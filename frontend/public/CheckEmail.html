    <script>
document.addEventListener("DOMContentLoaded", () => {
    // 1. Get the email address. 
    // This example looks for it in the URL (e.g., ?email=test@gmail.com)
    // If you used sessionStorage on the previous page, use: sessionStorage.getItem('resetEmail')
   // const urlParams = new URLSearchParams(window.location.search);
    //const userEmail = urlParams.get('email'); 
    const userEmail = sessionStorage.getItem('resetEmail');

    if (userEmail) {
        // Extract the domain (e.g., "gmail.com")
        const domain = userEmail.split('@')[1]?.toLowerCase();
        let providerName = '';
        let providerUrl = '';

        // 2. Map domains to their inbox URLs
        if (domain === 'gmail.com') {
            providerName = 'Gmail';
            providerUrl = 'https://mail.google.com';
        } else if (['outlook.com', 'hotmail.com', 'live.com'].includes(domain)) {
            providerName = 'Outlook';
            providerUrl = 'https://outlook.live.com';
        } else if (domain === 'yahoo.com') {
            providerName = 'Yahoo Mail';
            providerUrl = 'https://mail.yahoo.com';
        } else if (['icloud.com', 'me.com', 'mac.com'].includes(domain)) {
            providerName = 'iCloud Mail';
            providerUrl = 'https://www.icloud.com/mail';
        }

        // 3. If a provider was found, update and show the button
        if (providerUrl) {
            const emailBtn = document.getElementById('open-email-btn');
            const emailBtnText = document.getElementById('email-btn-text');
            
            emailBtn.href = providerUrl;
            emailBtnText.textContent = `Open ${providerName}`;
            
            // Remove 'hidden' and add 'flex' to show it with Tailwind styling
            emailBtn.classList.remove('hidden');
            emailBtn.classList.add('flex');
            
            // Re-initialize Lucide icons so the new icon renders
            if (window.lucide) {
                lucide.createIcons();
            }
        }
    }
});
</script>
