    <script>
        lucide.createIcons();

        let scripts = [];
        let activeId = null;
        let settings = {
            power: 'standard',
            strings: true,
            controlflow: true,
            minify: true
        };

        let currentTotalCost = 0;

        // Temporary balance for the frontend prototype.
        // Replace this with your real account/credit API.
        const MOCK_BALANCE = 40;

        // Where the results page lives.
        const RESULTS_PAGE = '/obfuscate/results.html';
        const STORAGE_PREFIX = 'obfuscation:';

        const el = (id) => document.getElementById(id);

        function uid() {
            if (window.crypto && typeof crypto.randomUUID === 'function') {
                return crypto.randomUUID().replaceAll('-', '').slice(0, 12);
            }

            return Math.random().toString(36).slice(2, 14);
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function newScript(name, content = '') {
            const script = {
                id: uid(),
                name,
                content,
                valid: content.trim().length > 0
            };

            scripts.push(script);
            activeId = script.id;

            return script;
        }

        newScript('main.lua');

        function checkValidity(code) {
            if (!code.trim()) {
                return {
                    valid: false,
                    reason: 'empty'
                };
            }

            return {
                valid: true,
                reason: null
            };
        }

        function estimateCost(script) {
            if (!script.valid) return 0;

            const base = {
                light: 2,
                standard: 4,
                heavy: 7
            }[settings.power];

            const sizeFactor = Math.ceil(script.content.length / 800);

            let cost = base + sizeFactor;

            if (settings.strings) cost += 1;
            if (settings.controlflow) cost += 2;

            return cost;
        }

        function renderTabs() {
            const strip = el('tab-strip');
            strip.innerHTML = '';

            scripts.forEach((script) => {
                const tab = document.createElement('button');
                const isActive = script.id === activeId;

                tab.className = `group flex items-center gap-2 px-5 py-3 text-[13px] border-r border-gray-300/40 dark:border-white/10 shrink-0 transition-colors font-mono ${
                    isActive
                        ? 'bg-white/60 dark:bg-white/10 text-gray-900 dark:text-white shadow-[inset_0_-2px_0_0_var(--tw-color-solarglyph)] dark:shadow-[inset_0_-2px_0_0_#60a5fa]'
                        : 'text-gray-500 dark:text-gray-400 hover:bg-black/5 dark:hover:bg-white/5 hover:text-gray-800 dark:hover:text-gray-200'
                }`;

                tab.innerHTML = `
                    <span class="w-2 h-2 rounded-full ${
                        script.valid
                            ? 'bg-green-500 shadow-[0_0_5px_rgba(34,197,94,0.4)]'
                            : (script.content ? 'bg-red-500' : 'bg-gray-400')
                    }"></span>

                    <span>${escapeHtml(script.name)}</span>

                    ${scripts.length > 1 ? `
                        <i data-lucide="x"
                           class="w-3.5 h-3.5 ml-2 opacity-0 group-hover:opacity-100 hover:!text-red-500 transition-opacity"></i>
                    ` : ''}
                `;

                tab.addEventListener('click', (event) => {
                    if (event.target.closest('[data-lucide="x"]')) {
                        scripts = scripts.filter(x => x.id !== script.id);

                        if (activeId === script.id) {
                            activeId = scripts[0]?.id ?? null;
                        }

                        renderAll();
                        return;
                    }

                    activeId = script.id;
                    renderAll();
                });

                strip.appendChild(tab);
            });

            lucide.createIcons();
        }

        function updateMainButtonState() {
            let total = 0;

            scripts.forEach((script) => {
                total += estimateCost(script);
            });

            currentTotalCost = total;
            el('total-cost').textContent = `${total} CR`;

            const button = el('open-modal-btn');
            const anyValid = scripts.some(script => script.valid);

            button.disabled = !anyValid || total > MOCK_BALANCE;
        }

        function renderEditor() {
            const active = scripts.find(script => script.id === activeId);
            const input = el('script-input');
            const badge = el('validity-badge');
            const count = el('char-count');

            input.value = active ? active.content : '';
            input.disabled = !active;

            if (!active || !active.content) {
                badge.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-gray-400 shadow-sm shadow-gray-400/50"></span>
                    Empty
                `;

                count.textContent = '0 chars';
                return;
            }

            if (active.valid) {
                badge.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></span>
                    Ready
                `;
            } else {
                badge.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-red-500"></span>
                    Invalid
                `;
            }

            count.textContent = `${active.content.length} chars`;
        }

        function renderAll() {
            scripts.forEach((script) => {
                script.valid = checkValidity(script.content).valid;
            });

            renderTabs();
            renderEditor();
            updateMainButtonState();
        }

        function createObfuscationId() {
            return uid();
        }

        function getStorageKey(id) {
            return `${STORAGE_PREFIX}${id}`;
        }

        function saveObfuscationSession(session) {
            localStorage.setItem(
                getStorageKey(session.id),
                JSON.stringify(session)
            );
        }

        function buildObfuscationSession() {
            const id = createObfuscationId();

            const validScripts = scripts
                .filter(script => script.valid)
                .map(script => ({
                    id: script.id,
                    name: script.name,
                    source: script.content,
                    output: null,
                    status: 'queued'
                }));

            return {
                id,
                status: 'processing',
                createdAt: new Date().toISOString(),
                completedAt: null,
                engine: 'v1',
                progress: 0,
                totalCost: currentTotalCost,
                scriptCount: validScripts.length,
                settings: { ...settings },
                scripts: validScripts,
                error: null
            };
        }

        async function obfuscateScript(script, session) {
            // ======================================================
            // REPLACE THIS FUNCTION WITH YOUR REAL API REQUEST.
            // ======================================================
            // Example:
            //
            // const response = await fetch('/api/obfuscate', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify({
            //         source: script.source,
            //         settings: session.settings
            //     })
            // });
            //
            // if (!response.ok) {
            //     throw new Error('Obfuscation request failed.');
            // }
            //
            // const data = await response.json();
            // return data.output;
            // ======================================================

            // Temporary demonstration delay.
            await new Promise(resolve => setTimeout(resolve, 700));

            // Temporary output so the results flow can be tested.
            // This is NOT a real obfuscation algorithm.
            return `-- Obfuscation preview\n-- Session: ${session.id}\n\n${script.source}`;
        }

        async function processObfuscation(session) {
            try {
                const total = session.scripts.length;

                for (let i = 0; i < total; i++) {
                    const script = session.scripts[i];

                    script.status = 'processing';
                    session.progress = Math.round((i / total) * 100);
                    saveObfuscationSession(session);

                    script.output = await obfuscateScript(script, session);
                    script.status = 'complete';

                    session.progress = Math.round(((i + 1) / total) * 100);
                    saveObfuscationSession(session);
                }

                session.status = 'complete';
                session.progress = 100;
                session.completedAt = new Date().toISOString();

                saveObfuscationSession(session);

                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.4 },
                    colors: ['#2563eb', '#3b82f6', '#60a5fa', '#ffffff'],
                    zIndex: 9999
                });

                await new Promise(resolve => setTimeout(resolve, 800));

                window.location.href =
                    `${RESULTS_PAGE}?id=${encodeURIComponent(session.id)}`;

            } catch (error) {
                console.error('Obfuscation failed:', error);

                session.status = 'error';
                session.error = error?.message || 'Unknown obfuscation error.';

                saveObfuscationSession(session);

                alert('Obfuscation failed. Your session has been saved.');
                closeModal();
            }
        }

        // Editor input
        el('script-input').addEventListener('input', (event) => {
            const active = scripts.find(script => script.id === activeId);
            if (!active) return;

            active.content = event.target.value;
            active.valid = checkValidity(active.content).valid;

            renderAll();
        });

        // Add script tab
        el('add-tab-btn').addEventListener('click', () => {
            newScript(`script${scripts.length + 1}.lua`);
            renderAll();
        });

        // Drag and drop
        const dropZone = el('drop-zone');
        const dropOverlay = el('drop-overlay');

        ['dragover', 'dragenter'].forEach((eventName) => {
            dropZone.addEventListener(eventName, (event) => {
                event.preventDefault();
                dropOverlay.classList.remove('hidden');
            });
        });

        ['dragleave', 'drop'].forEach((eventName) => {
            dropZone.addEventListener(eventName, (event) => {
                event.preventDefault();
                dropOverlay.classList.add('hidden');
            });
        });

        dropZone.addEventListener('drop', async (event) => {
            const files = Array.from(event.dataTransfer.files || []);

            for (const file of files) {
                const text = await file.text();
                newScript(file.name, text);
            }

            if (files.length) renderAll();
        });

        // Power levels
        document.querySelectorAll('.power-btn').forEach((button) => {
            button.addEventListener('click', () => {
                settings.power = button.dataset.power;

                document.querySelectorAll('.power-btn').forEach((other) => {
                    other.className =
                        'power-btn w-full flex items-center justify-between px-4 py-3 rounded-xl border border-gray-300/50 dark:border-white/10 hover:bg-white/40 dark:hover:bg-white/5 text-sm text-left transition-all';

                    other.querySelector('span:first-child').className = 'font-medium';
                    other.querySelector('span:last-child').className = 'text-xs font-mono text-gray-500';
                });

                button.className =
                    'power-btn w-full flex items-center justify-between px-4 py-3 rounded-xl border border-solarglyph dark:border-blue-400 bg-solarglyph/10 dark:bg-blue-400/10 shadow-[0_0_10px_rgba(37,99,235,0.1)] text-sm text-left transition-all';

                button.querySelector('span:first-child').className =
                    'font-medium text-solarglyph dark:text-blue-400';

                button.querySelector('span:last-child').className =
                    'text-xs font-mono text-solarglyph dark:text-blue-400';

                updateMainButtonState();
            });
        });

        // iOS toggles
        document.querySelectorAll('.ios-toggle').forEach((switchButton) => {
            switchButton.addEventListener('click', () => {
                const key = switchButton.dataset.toggle;
                settings[key] = !settings[key];

                if (settings[key]) {
                    switchButton.classList.add('bg-solarglyph', 'dark:bg-blue-500');
                    switchButton.classList.remove('bg-gray-300', 'dark:bg-white/20');
                    switchButton.querySelector('.ios-knob').classList.add('translate-x-5');
                    switchButton.querySelector('.ios-knob').classList.remove('translate-x-0');
                } else {
                    switchButton.classList.remove('bg-solarglyph', 'dark:bg-blue-500');
                    switchButton.classList.add('bg-gray-300', 'dark:bg-white/20');
                    switchButton.querySelector('.ios-knob').classList.remove('translate-x-5');
                    switchButton.querySelector('.ios-knob').classList.add('translate-x-0');
                }

                updateMainButtonState();
            });
        });

        // Modal
        const modal = el('receipt-modal');
        const modalContent = el('modal-content');

        el('open-modal-btn').addEventListener('click', () => {
            const validScripts = scripts.filter(script => script.valid);
            const list = el('modal-recipe-list');

            list.innerHTML = validScripts.map(script => `
                <div class="flex items-center justify-between py-2.5 border-b border-gray-300/20 dark:border-white/5 last:border-0">
                    <span class="text-sm font-mono flex items-center gap-2">
                        <i data-lucide="file-code-2" class="w-4 h-4 text-solarglyph dark:text-blue-400"></i>
                        ${escapeHtml(script.name)}
                    </span>

                    <span class="text-xs font-mono font-medium text-gray-500">
                        ${estimateCost(script)} CR
                    </span>
                </div>
            `).join('');

            el('modal-total-cost').textContent = `${currentTotalCost} CR`;
            el('modal-balance-after').textContent = `${MOCK_BALANCE - currentTotalCost} CR`;

            el('modal-receipt-body').classList.remove('hidden');
            el('modal-waiting-body').classList.add('hidden');

            modal.classList.remove('hidden');

            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);

            lucide.createIcons();
        });

        function closeModal() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        el('cancel-modal-btn').addEventListener('click', closeModal);
        el('close-modal-btn').addEventListener('click', closeModal);
        el('close-modal-bg').addEventListener('click', closeModal);

        // Confirm and start obfuscation
        el('confirm-obfuscate-btn').addEventListener('click', async () => {
            const session = buildObfuscationSession();

            // Save before processing starts so the job has a persistent ID.
            saveObfuscationSession(session);

            el('modal-receipt-body').classList.add('hidden');
            el('modal-waiting-body').classList.remove('hidden');
            el('modal-waiting-body').classList.add('flex');

            await processObfuscation(session);
        });

        // File import
        el('file-input').addEventListener('change', async (event) => {
            const files = Array.from(event.target.files || []);

            for (const file of files) {
                const text = await file.text();
                newScript(file.name, text);
            }

            if (files.length) renderAll();

            event.target.value = '';
        });

        renderAll();
</script>

</body>

</html>
