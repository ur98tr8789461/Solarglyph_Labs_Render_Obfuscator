<!DOCTYPE html>
<html lang="en" class="dark style-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obfuscate | Solarglyph Labs</title>
    <link rel="icon" href="https://www.solarglyphlabs.com/images/Logo/SolarglyphLabsLogoCut.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            500: '#6366f1', // Indigo primary
                            600: '#4f46e5',
                        }
                    }
                }
            }

    <style>
        /* Sleek Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.5); }
        
        textarea.script-input {
            tab-size: 4;
            background: transparent;
        }
        textarea.script-input::placeholder { color: #9CA3AF; }
        .dark textarea.script-input::placeholder { color: #52525B; }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; }
        
        /* Modal Transitions */
        .modal-enter { opacity: 0; transform: scale(0.95) translateY(10px); }
        .modal-enter-active { opacity: 1; transform: scale(1) translateY(0); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .modal-exit { opacity: 1; transform: scale(1); }
        .modal-exit-active { opacity: 0; transform: scale(0.95); pointer-events: none; transition: all 0.2s ease-in; }

        /* Custom Toggle Switch */
        .modern-toggle { transition: background-color 0.3s ease; }
        .modern-knob { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        /* Animated Background Gradient */
        .bg-mesh {
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, hsla(225,39%,30%,0.3) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(339,49%,30%,0.3) 0, transparent 50%);
        }
        .light .bg-mesh {
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,97%,1) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, hsla(225,39%,80%,0.3) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(339,49%,80%,0.3) 0, transparent 50%);
        }
    </style>
</head>
<body class="text-zinc-900 dark:text-zinc-100 transition-colors duration-500 overflow-x-hidden min-h-screen flex flex-col">
    
    <!-- Premium Animated Background -->
    <div class="fixed inset-0 z-[-2] bg-zinc-50 dark:bg-[#09090b] transition-colors duration-500">
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-100/50 via-zinc-50 to-zinc-50 dark:from-indigo-900/20 dark:via-[#09090b] dark:to-[#09090b]"></div>
    </div>

    <!-- Web Component Navigation -->
    <site-nav page="tool"></site-nav>

    <!-- Floating App Workspace -->
    <main class="relative z-10 flex-1 w-full max-w-[1500px] mx-auto pt-28 pb-12 px-4 sm:px-6 lg:px-8 flex flex-col lg:flex-row gap-6">
        
        <!-- LEFT COLUMN: EDITOR CARD -->
        <div class="flex-1 flex flex-col relative min-h-[600px] bg-white/80 dark:bg-zinc-900/60 backdrop-blur-xl rounded-2xl border border-zinc-200 dark:border-zinc-800 shadow-xl overflow-hidden transition-colors">

                <div>

                <button id="import-btn" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-300 transition-colors" onclick="document.getElementById('file-input').click()">

            <!-- Drag and Drop Overlay -->
            <div id="drop-overlay" class="absolute inset-0 z-20 hidden bg-brand-500/10 backdrop-blur-sm border-2 border-dashed border-brand-500 rounded-2xl flex items-center justify-center pointer-events-none transition-all">

                        <i data-lucide="file-down" class="w-8 h-8"></i>
                    </div>

            <!-- Pill Tabs -->

                <button id="add-tab-btn" class="flex items-center justify-center w-8 h-8 rounded-md text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-colors shrink-0 ml-1">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Text Area -->
            <div id="drop-zone" class="relative flex-1 group">
                <div class="absolute left-0 top-0 bottom-0 w-12 bg-zinc-50 dark:bg-zinc-900/50 border-r border-zinc-100 dark:border-zinc-800 flex flex-col items-center py-6 pointer-events-none opacity-50 select-none">
                    <!-- Faux line numbers for aesthetic -->
                    <span class="text-xs font-mono text-zinc-400 dark:text-zinc-600">1</span>
                </div>

                    placeholder="-- Paste a Luau script here&#10;&#10;local function greet(name)&#10;    print('Hello, ' .. name)&#10;end" spellcheck="false"></textarea>
            </div>
            
            <!-- Editor Footer -->

                    <span class="flex items-center gap-1.5"><i data-lucide="code" class="w-3 h-3"></i> Luau</span>
                    <span id="char-count">0 chars</span>

        </div>

        <!-- RIGHT COLUMN: SETTINGS CARD -->

                <!-- Power -->

                    <div class="flex flex-col gap-2.5" id="power-group">

                        <button data-power="standard" class="power-btn w-full flex items-center justify-between px-4 py-3.5 rounded-xl border-2 border-brand-500 bg-brand-50 dark:bg-brand-500/10 shadow-[0_4px_12px_rgba(99,102,241,0.1)] text-sm text-left transition-all">
                            <div class="flex items-center gap-2">

                        <button data-power="heavy" class="power-btn w-full flex items-center justify-between px-4 py-3.5 rounded-xl border border-zinc-200 dark:border-zinc-700/80 bg-transparent hover:bg-zinc-50 dark:hover:bg-zinc-800/50 text-sm text-left transition-all">
                            <span class="font-medium text-zinc-700 dark:text-zinc-300">Heavy</span>
                            <span class="text-xs font-mono text-zinc-400">7 CR</span>

                <!-- Modern Toggles -->

                    <h3 class="text-[12px] uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-3 font-semibold flex items-center gap-2">
                        <i data-lucide="sliders-horizontal" class="w-4 h-4"></i> Configuration
                    </h3>
                    <div class="bg-zinc-50 dark:bg-zinc-800/30 border border-zinc-200 dark:border-zinc-700/80 rounded-xl overflow-hidden">
                        <label class="flex items-center justify-between px-5 py-4 border-b border-zinc-200 dark:border-zinc-700/80 cursor-pointer group hover:bg-zinc-100/50 dark:hover:bg-zinc-700/30 transition-colors">
                            <span class="text-sm font-medium text-zinc-700 dark:text-zinc-200">String Encryption</span>
                            <button type="button" class="modern-toggle relative w-11 h-6 rounded-full bg-brand-500 transition-colors focus:outline-none" data-toggle="strings">
                                <span class="modern-knob absolute top-[2px] left-[2px] w-5 h-5 rounded-full bg-white shadow-sm transform translate-x-5"></span>

                        </label>
                        <label class="flex items-center justify-between px-5 py-4 border-b border-zinc-200 dark:border-zinc-700/80 cursor-pointer group hover:bg-zinc-100/50 dark:hover:bg-zinc-700/30 transition-colors">
                            <span class="text-sm font-medium text-zinc-700 dark:text-zinc-200">Control Flow</span>

                                <span class="modern-knob absolute top-[2px] left-[2px] w-5 h-5 rounded-full bg-white shadow-sm transform translate-x-5"></span>

                            <button type="button" class="modern-toggle relative w-11 h-6 rounded-full bg-brand-500 transition-colors focus:outline-none" data-toggle="minify">

                            </button>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Fixed Action Footer -->

                <div class="flex justify-between items-center mb-5">

                    <span id="total-cost" class="text-2xl font-bold font-mono tracking-tight text-zinc-900 dark:text-white">0 CR</span>
                </div>
                <button id="open-modal-btn" disabled class="w-full bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 disabled:bg-zinc-200 dark:disabled:bg-zinc-800 disabled:text-zinc-400 dark:disabled:text-zinc-600 py-3.5 rounded-xl font-semibold hover:not-disabled:scale-[1.02] hover:not-disabled:shadow-lg transition-all duration-200 flex items-center justify-center gap-2">

    <script src="/shared/site.js"></script>

    <!-- Refined Minimalist Modal -->
    <div id="receipt-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center px-4">
        <div class="absolute inset-0 bg-zinc-900/40 dark:bg-black/60 backdrop-blur-sm transition-opacity" id="close-modal-bg"></div>
        <div class="relative w-full max-w-md bg-white dark:bg-zinc-900 rounded-3xl shadow-2xl border border-zinc-200 dark:border-zinc-800 overflow-hidden transition-all transform scale-95 opacity-0" id="modal-content">
            
            <div class="p-6 border-b border-zinc-100 dark:border-zinc-800 flex items-center justify-between bg-zinc-50/50 dark:bg-zinc-900/50">
                <h3 class="text-lg font-semibold tracking-tight">Confirm Request</h3>
                <button id="close-modal-btn" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-zinc-200 dark:hover:bg-zinc-800 text-zinc-500 transition-colors">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div id="modal-receipt-body">
                <div class="p-6 pb-4">
                    <div id="modal-recipe-list" class="space-y-1.5 mb-6 max-h-48 overflow-y-auto pr-2 scrollbar-thin"></div>
                    
                    <div class="bg-zinc-50 dark:bg-zinc-800/50 rounded-xl p-5 border border-zinc-100 dark:border-zinc-700/50">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-sm text-zinc-500 dark:text-zinc-400 font-medium">Total Cost</span>
                            <span id="modal-total-cost" class="font-mono font-bold text-lg text-zinc-900 dark:text-white">0 CR</span>
                        </div>
                        <div class="h-px w-full bg-zinc-200 dark:bg-zinc-700/50 mb-3"></div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-zinc-500 dark:text-zinc-400">Balance After</span>
                            <span id="modal-balance-after" class="font-mono text-sm font-medium text-brand-600 dark:text-brand-400"></span>
                        </div>
                    </div>
                </div>
                
                <div class="flex p-6 pt-2 gap-3 bg-zinc-50/50 dark:bg-zinc-900/50">
                    <button id="cancel-modal-btn" class="flex-1 py-3 rounded-xl bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 font-medium text-zinc-700 dark:text-zinc-300 hover:bg-zinc-50 dark:hover:bg-zinc-700 transition-colors">Cancel</button>
                    <button id="confirm-obfuscate-btn" class="flex-1 py-3 rounded-xl bg-brand-600 text-white font-medium hover:bg-brand-500 hover:shadow-lg hover:shadow-brand-500/20 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="check-circle-2" class="w-4 h-4"></i> Pay & Run
                    </button>
                </div>
            </div>

            <div class="p-12 hidden flex-col items-center justify-center text-center space-y-5 min-h-[350px]" id="modal-waiting-body">
                <div class="relative">
                    <div class="absolute inset-0 bg-brand-500/20 blur-xl rounded-full"></div>
                    <i data-lucide="loader-2" class="relative w-12 h-12 text-brand-600 dark:text-brand-400 spin mx-auto"></i>
                </div>
                <div>
                    <h3 class="text-lg font-semibold text-zinc-900 dark:text-white mb-1">Obfuscating Code...</h3>
                    <p class="text-sm text-zinc-500 dark:text-zinc-400">Compiling Abstract Syntax Tree.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // All core functionality from the original prompt remains entirely unmodified.
        lucide.createIcons();

        let scripts = [];
        let activeId = null;
        let settings = { power: 'standard', strings: true, controlflow: true, minify: true };
        let currentTotalCost = 0;
        const MOCK_BALANCE = 40;

        const el = (id) => document.getElementById(id);
        function uid() { return Math.random().toString(36).slice(2, 9); }

        function newScript(name, content = '') {
            const s = { id: uid(), name, content, valid: content.trim().length > 0 };
            scripts.push(s);
            activeId = s.id;
            return s;
        }

        newScript('main.lua');

        function checkValidity(code) {
            if (!code.trim()) return { valid: false, reason: 'empty' };
            return { valid: true };
        }

        function estimateCost(script) {
            if (!script.valid) return 0;
            const base = { light: 2, standard: 4, heavy: 7 }[settings.power];
            const sizeFactor = Math.ceil(script.content.length / 800);
            let cost = base + sizeFactor;
            if (settings.strings) cost += 1;
            if (settings.controlflow) cost += 2;
            return cost;
        }

        function renderTabs() {
            const strip = el('tab-strip');
            strip.innerHTML = '';
            scripts.forEach(s => {
                const tab = document.createElement('button');
                const isActive = s.id === activeId;
                
                // NEW PILL DESIGN CLASSES
                tab.className = `group flex items-center gap-2 px-3.5 py-1.5 rounded-md text-[13px] font-medium transition-all font-mono shrink-0 ${
                    isActive 
                    ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow-sm border border-zinc-200 dark:border-zinc-700' 
                    : 'text-zinc-500 dark:text-zinc-400 hover:bg-zinc-200/50 dark:hover:bg-zinc-800/50 border border-transparent'
                }`;
                
                tab.innerHTML = `
                    <span class="w-1.5 h-1.5 rounded-full ${s.valid ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]' : (s.content ? 'bg-red-500' : 'bg-zinc-400')}"></span>
                    <span>${s.name}</span>
                    ${scripts.length > 1 ? `<i data-lucide="x" class="w-3.5 h-3.5 ml-1 opacity-0 group-hover:opacity-100 hover:!text-red-500 transition-opacity"></i>` : ''}
                `;
                tab.addEventListener('click', (e) => {
                    if (e.target.closest('[data-lucide="x"]')) {
                        scripts = scripts.filter(x => x.id !== s.id);
                        if (activeId === s.id) activeId = scripts[0]?.id;
                        renderAll();
                        return;
                    }
                    activeId = s.id;
                    renderAll();
                });
                strip.appendChild(tab);
            });
            lucide.createIcons();
        }

        function updateMainButtonState() {
            let total = 0;
            scripts.forEach(s => total += estimateCost(s));
            currentTotalCost = total;
            el('total-cost').textContent = `${total} CR`;
            
            const btn = el('open-modal-btn');
            const anyValid = scripts.some(s => s.valid);
            btn.disabled = !anyValid || total > MOCK_BALANCE;
        }

        function renderEditor() {
            const active = scripts.find(s => s.id === activeId);
            const input = el('script-input');
            input.value = active ? active.content : '';
            input.disabled = !active;

            const badge = el('validity-badge');
            const count = el('char-count');
            if (!active || !active.content) {
                badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-zinc-400"></span> Empty';
                count.textContent = '0 chars';
            } else if (active.valid) {
                badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></span> Ready';
                count.textContent = `${active.content.length} chars`;
            }
        }

        function renderAll() {
            scripts.forEach(s => {
                s.valid = checkValidity(s.content).valid;
            });
            renderTabs();
            renderEditor();
            updateMainButtonState();
        }

        // Editor Input
        el('script-input').addEventListener('input', (e) => {
            const active = scripts.find(s => s.id === activeId);
            if (!active) return;
            active.content = e.target.value;
            active.valid = checkValidity(active.content).valid;
            renderAll();
        });

        el('add-tab-btn').addEventListener('click', () => { newScript(`script${scripts.length + 1}.lua`); renderAll(); });
        
        // Drag and Drop
        const dropZone = el('drop-zone');
        const dropOverlay = el('drop-overlay');
        ['dragover', 'dragenter'].forEach(evt => dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropOverlay.classList.remove('hidden'); }));
        ['dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropOverlay.classList.add('hidden'); }));
        dropZone.addEventListener('drop', async (e) => {
            const files = Array.from(e.dataTransfer.files || []);
            for (const file of files) { const text = await file.text(); newScript(file.name, text); }
            if (files.length) renderAll();
        });

        // Config UI (Power Level) - UPDATED CSS CLASSES
        document.querySelectorAll('.power-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                settings.power = btn.dataset.power;
                
                // Reset all
                document.querySelectorAll('.power-btn').forEach(b => {
                    b.className = 'power-btn w-full flex items-center justify-between px-4 py-3.5 rounded-xl border border-zinc-200 dark:border-zinc-700/80 bg-transparent hover:bg-zinc-50 dark:hover:bg-zinc-800/50 text-sm text-left transition-all';
                    const title = b.dataset.power.charAt(0).toUpperCase() + b.dataset.power.slice(1);
                    b.innerHTML = `
                        <span class="font-medium text-zinc-700 dark:text-zinc-300">${title}</span>
                        <span class="text-xs font-mono text-zinc-400">${b.querySelector('.font-mono').textContent}</span>
                    `;
                });

                // Set Active
                const title = btn.dataset.power.charAt(0).toUpperCase() + btn.dataset.power.slice(1);
                const cost = btn.querySelector('.font-mono').textContent;
                btn.className = 'power-btn w-full flex items-center justify-between px-4 py-3.5 rounded-xl border-2 border-brand-500 bg-brand-50 dark:bg-brand-500/10 shadow-[0_4px_12px_rgba(99,102,241,0.1)] text-sm text-left transition-all';
                btn.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
                        <span class="font-semibold text-brand-700 dark:text-brand-400">${title}</span>
                    </div>
                    <span class="text-xs font-mono font-medium text-brand-600 dark:text-brand-400">${cost}</span>
                `;
                
                updateMainButtonState();
            });
        });

        // Config UI (Modern Toggles)
        document.querySelectorAll('.modern-toggle').forEach(sw => {
            sw.addEventListener('click', () => {
                const key = sw.dataset.toggle;
                settings[key] = !settings[key];
                
                if (settings[key]) {
                    sw.classList.add('bg-brand-500');
                    sw.classList.remove('bg-zinc-200', 'dark:bg-zinc-700');
                    sw.querySelector('.modern-knob').classList.add('translate-x-5');
                    sw.querySelector('.modern-knob').classList.remove('translate-x-0', 'shadow-none', 'bg-zinc-400');
                } else {
                    sw.classList.remove('bg-brand-500');
                    sw.classList.add('bg-zinc-200', 'dark:bg-zinc-700');
                    sw.querySelector('.modern-knob').classList.remove('translate-x-5');
                    sw.querySelector('.modern-knob').classList.add('translate-x-0', 'shadow-none', 'bg-zinc-400');
                }
                updateMainButtonState();
            });
        });

        // Modal Logic
        const modal = el('receipt-modal');
        const modalContent = el('modal-content');

        el('open-modal-btn').addEventListener('click', () => {
            const list = el('modal-recipe-list');
            list.innerHTML = scripts.filter(s => s.valid).map(s => `
                <div class="flex items-center justify-between py-2 border-b border-zinc-100 dark:border-zinc-800 last:border-0">
                    <span class="text-sm font-mono flex items-center gap-2.5 text-zinc-700 dark:text-zinc-300">
                        <i data-lucide="file-code" class="w-4 h-4 text-brand-500"></i> ${s.name}
                    </span>
                    <span class="text-sm font-mono font-medium text-zinc-500">${estimateCost(s)} CR</span>
                </div>
            `).join('');

            el('modal-total-cost').textContent = `${currentTotalCost} CR`;
            el('modal-balance-after').textContent = `${MOCK_BALANCE - currentTotalCost} CR`;

            el('modal-receipt-body').classList.remove('hidden');
            el('modal-waiting-body').classList.add('hidden');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
            lucide.createIcons();
        });

        const closeModal = () => {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        };
        el('cancel-modal-btn').addEventListener('click', closeModal);
        el('close-modal-btn').addEventListener('click', closeModal);
        el('close-modal-bg').addEventListener('click', closeModal);

        el('confirm-obfuscate-btn').addEventListener('click', async () => {
            el('modal-receipt-body').classList.add('hidden');
            el('modal-waiting-body').classList.remove('hidden');
            el('modal-waiting-body').classList.add('flex');
            
            await new Promise(r => setTimeout(r, 1200));

            const sessionId = 'obs_' + uid() + Date.now().toString(36);
            
            const sessionData = {
                timestamp: Date.now(),
                totalCost: currentTotalCost,
                settings: settings,
                scripts: scripts.filter(s => s.valid).map(s => ({
                    id: s.id,
                    name: s.name,
                    content: s.content 
                }))
            };
            
            localStorage.setItem(sessionId, JSON.stringify(sessionData));

            // Confetti remains exactly as requested
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.4 },
                colors: ['#4f46e5', '#6366f1', '#818cf8', '#ffffff'],
                zIndex: 9999
            });

            setTimeout(() => { 
                closeModal(); 
                window.location.href = `/results.html?id=${sessionId}`; 
            }, 1800);
        });

        // Handle File Input
        el('file-input').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files || []);
            for (const file of files) { const text = await file.text(); newScript(file.name, text); }
            if (files.length) renderAll();
            e.target.value = '';
        });

        renderAll();
    </script>
</body>
</html>
