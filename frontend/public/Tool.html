<!DOCTYPE html>
<html lang="en" class="dark style-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obfuscate | Solarglyph Labs</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Added Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { --mono: 'JetBrains Mono', ui-monospace, monospace; }
        .mono { font-family: var(--mono); }
        
        textarea.script-input::-webkit-scrollbar { width: 8px; }
        textarea.script-input::-webkit-scrollbar-track { background: transparent; }
        textarea.script-input::-webkit-scrollbar-thumb { background: rgba(120,130,150,0.2); border-radius: 4px; }
        
        textarea.script-input {
            font-family: var(--mono);
            font-size: 13.5px;
            line-height: 24px;
            tab-size: 4;
            background: transparent;
        }
        
        /* Unified layout specific styles */
        .workspace-border { border-color: rgba(255,255,255,0.1); }
        .dark .workspace-border { border-color: rgba(255,255,255,0.08); }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; }
        .toggle-knob { transition: transform 0.15s cubic-bezier(0.16,1,0.3,1); }
    </style>
</head>
<body class="text-gray-800 dark:text-gray-200 bg-gray-50 dark:bg-[#0a0a0c] transition-colors duration-500 overflow-x-hidden min-h-screen flex flex-col">

    <!-- Navbar Placeholder -->
    <nav class="h-16 border-b border-gray-200 dark:border-white/5 flex items-center px-6 bg-white dark:bg-black/20">
        <div class="font-bold text-lg tracking-tight flex items-center gap-2">
            <div class="w-6 h-6 rounded bg-blue-600"></div> Solarglyph Labs
        </div>
    </nav>

    <main class="flex-1 max-w-[1400px] w-full mx-auto p-4 md:p-8 flex flex-col">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-semibold tracking-tight">Obfuscator Engine</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Secure your Luau scripts before deployment.</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="px-4 py-2 rounded-lg border border-gray-200 dark:border-white/10 bg-white dark:bg-[#121214] text-sm flex items-center gap-2 shadow-sm">
                    <span class="text-gray-500">Balance:</span>
                    <span id="balance-display" class="mono font-semibold text-blue-600 dark:text-blue-400">40 CR</span>
                </div>
            </div>
        </div>

        <!-- UNIFIED WORKSPACE (No floating bubbles, one solid container) -->
        <div class="flex flex-col lg:flex-row flex-1 bg-white dark:bg-[#121214] border border-gray-200 dark:border-white/10 rounded-xl shadow-xl overflow-hidden min-h-[650px]">
            
            <!-- LEFT COLUMN: EDITOR -->
            <div class="flex-1 flex flex-col border-r border-gray-200 dark:border-white/10">
                <!-- Editor Toolbar -->
                <div class="h-12 border-b border-gray-200 dark:border-white/10 flex items-center bg-gray-50/50 dark:bg-black/20">
                    <div id="tab-strip" class="flex h-full overflow-x-auto"></div>
                    <button id="add-tab-btn" class="px-3 text-gray-400 hover:text-blue-500 h-full border-r border-gray-200 dark:border-white/10">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                    <div class="flex-1"></div>
                    <button id="import-btn" class="px-4 text-xs font-medium text-gray-500 hover:text-gray-900 dark:hover:text-white flex items-center gap-2 h-full">
                        <i data-lucide="upload" class="w-3.5 h-3.5"></i> Import File
                    </button>
                    <input type="file" id="file-input" accept=".lua,.luau,.txt" multiple class="hidden">
                </div>

                <!-- Text Area -->
                <div class="flex-1 relative bg-[#FAFAFA] dark:bg-[#0D0D0F]">
                    <textarea id="script-input" class="script-input absolute inset-0 w-full h-full resize-none outline-none p-6 text-gray-800 dark:text-gray-200"
                        placeholder="-- Paste a Luau script here&#10;&#10;local function greet(name)&#10;    print('Hello, ' .. name)&#10;end" spellcheck="false"></textarea>
                </div>
                
                <!-- Status Bar -->
                <div class="h-8 border-t border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-black/40 flex items-center justify-between px-4 text-[11px] mono uppercase text-gray-500">
                    <div id="validity-badge" class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-gray-400"></span> Empty
                    </div>
                    <span id="char-count">0 chars</span>
                </div>
            </div>

            <!-- RIGHT COLUMN: CONFIGURATION -->
            <div class="w-full lg:w-80 flex flex-col bg-gray-50/30 dark:bg-[#161618]">
                <div class="p-5 flex-1 space-y-6 overflow-y-auto">
                    
                    <!-- Engine -->
                    <div>
                        <label class="text-[11px] font-semibold uppercase tracking-wider text-gray-500 block mb-2">Engine Version</label>
                        <select class="w-full bg-white dark:bg-[#0D0D0F] border border-gray-200 dark:border-white/10 rounded-lg px-3 py-2 text-sm outline-none">
                            <option>v1 — Standard Luau</option>
                        </select>
                    </div>

                    <!-- Power -->
                    <div>
                        <label class="text-[11px] font-semibold uppercase tracking-wider text-gray-500 block mb-2">Power Level</label>
                        <div class="grid grid-cols-3 gap-1 bg-gray-200/50 dark:bg-black/40 p-1 rounded-lg">
                            <button class="power-btn text-xs py-1.5 rounded-md text-gray-500 hover:text-gray-800 dark:hover:text-white" data-power="light">Light</button>
                            <button class="power-btn text-xs py-1.5 rounded-md bg-white dark:bg-[#252528] shadow-sm text-blue-600 dark:text-blue-400 font-medium" data-power="standard">Standard</button>
                            <button class="power-btn text-xs py-1.5 rounded-md text-gray-500 hover:text-gray-800 dark:hover:text-white" data-power="heavy">Heavy</button>
                        </div>
                    </div>

                    <!-- Toggles -->
                    <div class="space-y-3">
                        <label class="text-[11px] font-semibold uppercase tracking-wider text-gray-500 block">Features</label>
                        
                        <label class="flex items-center justify-between cursor-pointer">
                            <span class="text-sm">String encryption</span>
                            <span class="toggle-switch relative inline-block w-8 h-4 rounded-full bg-blue-500" data-toggle="strings">
                                <span class="toggle-knob absolute top-0.5 left-0.5 w-3 h-3 rounded-full bg-white transform translate-x-4"></span>
                            </span>
                        </label>

                        <label class="flex items-center justify-between cursor-pointer">
                            <span class="text-sm">Control-flow</span>
                            <span class="toggle-switch relative inline-block w-8 h-4 rounded-full bg-blue-500" data-toggle="controlflow">
                                <span class="toggle-knob absolute top-0.5 left-0.5 w-3 h-3 rounded-full bg-white transform translate-x-4"></span>
                            </span>
                        </label>
                    </div>
                </div>

                <!-- Action Footer -->
                <div class="p-5 border-t border-gray-200 dark:border-white/10 bg-white dark:bg-[#121214]">
                    <div class="flex justify-between items-end mb-4">
                        <span class="text-sm text-gray-500">Total Cost</span>
                        <span id="total-cost" class="text-lg font-semibold mono">0 CR</span>
                    </div>
                    <button id="open-modal-btn" disabled class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 dark:disabled:bg-white/5 disabled:text-gray-500 text-white py-3 rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                        Obfuscate Scripts <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Receipt Modal -->
    <div id="receipt-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="close-modal-bg"></div>
        <div class="relative w-full max-w-sm bg-white dark:bg-[#121214] border border-gray-200 dark:border-white/10 rounded-xl shadow-2xl overflow-hidden" id="modal-content">
            <div class="p-5 border-b border-gray-200 dark:border-white/10">
                <h3 class="font-semibold text-lg">Confirm Payment</h3>
            </div>
            
            <div class="p-5" id="modal-receipt-body">
                <div id="modal-recipe-list" class="space-y-2 mb-4 max-h-32 overflow-y-auto text-sm"></div>
                <div class="bg-gray-50 dark:bg-black/20 rounded-lg p-3 border border-gray-200 dark:border-white/5">
                    <div class="flex justify-between text-sm mb-1"><span class="text-gray-500">Cost</span><span id="modal-total-cost" class="mono font-medium"></span></div>
                    <div class="flex justify-between text-sm"><span class="text-gray-500">Remaining</span><span id="modal-balance-after" class="mono text-blue-500"></span></div>
                </div>
            </div>

            <!-- Loading State -->
            <div class="p-10 hidden flex-col items-center justify-center text-center space-y-3" id="modal-waiting-body">
                <i data-lucide="loader-2" class="w-8 h-8 text-blue-500 spin mx-auto"></i>
                <h3 class="font-medium text-sm">Processing...</h3>
            </div>

            <div class="p-4 border-t border-gray-200 dark:border-white/10 flex gap-2" id="modal-footer">
                <button id="cancel-modal-btn" class="flex-1 py-2.5 rounded-lg border border-gray-200 dark:border-white/10 text-sm font-medium hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">Cancel</button>
                <button id="confirm-obfuscate-btn" class="flex-1 py-2.5 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 transition-colors">Confirm & Pay</button>
            </div>
        </div>
    </div>

    <script>
        let scripts = [];
        let activeId = null;
        let settings = { power: 'standard', strings: true, controlflow: true };
        let currentTotalCost = 0;
        const MOCK_BALANCE = 40;

        const el = (id) => document.getElementById(id);
        function uid() { return Math.random().toString(36).slice(2, 9); }

        function newScript(name, content = '') {
            const s = { id: uid(), name, content, valid: content.trim().length > 0 };
            scripts.push(s);
            activeId = s.id;
            return s;
        }

        newScript('main.lua');

        function checkValidity(code) { return { valid: code.trim().length > 0 }; }

        function estimateCost(script) {
            if (!script.valid) return 0;
            let cost = { light: 2, standard: 4, heavy: 7 }[settings.power];
            if (settings.strings) cost += 1;
            if (settings.controlflow) cost += 2;
            return cost;
        }

        function renderTabs() {
            const strip = el('tab-strip');
            strip.innerHTML = '';
            scripts.forEach(s => {
                const tab = document.createElement('button');
                const isActive = s.id === activeId;
                tab.className = `flex items-center gap-2 px-4 h-full text-[13px] border-r border-gray-200 dark:border-white/10 transition-colors ${
                    isActive ? 'bg-[#FAFAFA] dark:bg-[#0D0D0F] border-t-2 border-t-blue-500 text-blue-600 dark:text-blue-400' : 'text-gray-500 hover:bg-gray-100 dark:hover:bg-white/5 border-t-2 border-t-transparent'
                }`;
                tab.innerHTML = `<span class="mono">${s.name}</span>`;
                tab.addEventListener('click', () => { activeId = s.id; renderAll(); });
                strip.appendChild(tab);
            });
        }

        function updateState() {
            let total = 0;
            scripts.forEach(s => {
                s.valid = checkValidity(s.content).valid;
                total += estimateCost(s);
            });
            currentTotalCost = total;
            el('total-cost').textContent = `${total} CR`;
            el('open-modal-btn').disabled = !scripts.some(s => s.valid) || total > MOCK_BALANCE;
        }

        function renderAll() {
            renderTabs();
            const active = scripts.find(s => s.id === activeId);
            el('script-input').value = active ? active.content : '';
            el('char-count').textContent = `${active ? active.content.length : 0} chars`;
            
            const badge = el('validity-badge');
            if(!active || !active.content) badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-gray-400"></span> Empty';
            else badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500"></span> Ready';
            
            updateState();
        }

        // Input
        el('script-input').addEventListener('input', (e) => {
            const active = scripts.find(s => s.id === activeId);
            if(active) { active.content = e.target.value; renderAll(); }
        });

        // Toggles
        document.querySelectorAll('.power-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                settings.power = btn.dataset.power;
                document.querySelectorAll('.power-btn').forEach(b => {
                    b.className = 'power-btn text-xs py-1.5 rounded-md text-gray-500 hover:text-gray-800 dark:hover:text-white';
                });
                btn.className = 'power-btn text-xs py-1.5 rounded-md bg-white dark:bg-[#252528] shadow-sm text-blue-600 dark:text-blue-400 font-medium';
                updateState();
            });
        });

        document.querySelectorAll('[data-toggle]').forEach(sw => {
            sw.addEventListener('click', () => {
                const key = sw.dataset.toggle;
                settings[key] = !settings[key];
                sw.classList.toggle('bg-blue-500', settings[key]);
                sw.classList.toggle('bg-gray-300', !settings[key]);
                sw.querySelector('.toggle-knob').classList.toggle('translate-x-4', settings[key]);
                sw.querySelector('.toggle-knob').classList.toggle('translate-x-0', !settings[key]);
                updateState();
            });
        });

        // Modal Logic
        const modal = el('receipt-modal');
        el('open-modal-btn').addEventListener('click', () => {
            el('modal-recipe-list').innerHTML = scripts.filter(s => s.valid).map(s => 
                `<div class="flex justify-between"><span class="mono">${s.name}</span><span class="text-gray-500">${estimateCost(s)} CR</span></div>`
            ).join('');
            el('modal-total-cost').textContent = `${currentTotalCost} CR`;
            el('modal-balance-after').textContent = `${MOCK_BALANCE - currentTotalCost} CR`;
            modal.classList.remove('hidden');
        });

        const closeModal = () => modal.classList.add('hidden');
        el('cancel-modal-btn').addEventListener('click', closeModal);
        el('close-modal-bg').addEventListener('click', closeModal);

        function mockObfuscate(code) {
            return `-- Obfuscated by Solarglyph Engine v1\nlocal _env = getfenv();\nlocal function _obf()\n${code.split('\n').map(l => '  ' + l).join('\n')}\nend\n_obf();`;
        }

        // The Confirmation + Confetti + Redirect
        el('confirm-obfuscate-btn').addEventListener('click', async () => {
            el('modal-receipt-body').classList.add('hidden');
            el('modal-footer').classList.add('hidden');
            el('modal-waiting-body').classList.remove('hidden');
            el('modal-waiting-body').classList.add('flex');
            
            await new Promise(r => setTimeout(r, 1000));

            // Trigger Confetti over the modal
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.4 }, // slightly higher up
                colors: ['#2563eb', '#3b82f6', '#60a5fa', '#ffffff'],
                zIndex: 9999
            });

            // Process data
            const validScripts = scripts.filter(s => s.valid);
            const results = validScripts.map(s => ({ 
                name: s.name, 
                original: s.content,
                output: mockObfuscate(s.content) 
            }));

            // Save to session storage for the next page to read
            sessionStorage.setItem('sg_current_results', JSON.stringify(results));

            // Redirect after allowing confetti to fall
            setTimeout(() => {
                window.location.href = 'results.html';
            }, 1800);
        });

        renderAll();
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
