<!DOCTYPE html>
<html lang="en" class="dark style-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password | Solarglyph Labs</title>
    <link rel="icon" href="https://www.solarglyphlabs.com/images/Logo/SolarglyphLabsLogoCut.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="/shared/theme-config.js"></script>
    <link rel="stylesheet" href="/shared/styles.css">
    <script src="/shared/components.js" defer></script>

    <!-- Supabase client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="text-apple-textLight dark:text-apple-textDark transition-colors duration-500 overflow-x-hidden">
    <div class="fixed inset-0 z-[-2] bg-cover bg-center" style="background-image: url('https://www.solarglyphlabs.com/images/Backgrounds/SolarGlyphCampus.png');"></div>
    <div class="fixed inset-0 z-[-1] bg-white/80 dark:bg-black/75 backdrop-blur-[24px] transition-colors duration-500"></div>

    <site-nav></site-nav>

    <main class="relative z-10 min-h-screen flex items-center justify-center px-4 pt-24 pb-16">
        <div class="w-full max-w-md">

            <div class="text-center mb-8 reveal active">
                <img src="https://www.solarglyphlabs.com/images/Logo/SolarglyphLabsLogoCut.png" alt="" class="w-10 h-10 mx-auto mb-4 opacity-90">
                <h1 class="text-3xl font-bold tracking-tight mb-2">Create New Password</h1>
                <p class="text-gray-600 dark:text-gray-400">Please enter your new password below.</p>
            </div>

            <div class="glass-card rounded-[2rem] p-8 md:p-10 reveal active">
                <!-- Error and Success Messages -->
                <div id="form-error" class="hidden mb-5 text-sm text-red-600 dark:text-red-400 bg-red-500/10 border border-red-500/20 rounded-xl px-4 py-3"></div>
                <div id="form-success" class="hidden mb-5 text-sm text-green-600 dark:text-green-400 bg-green-500/10 border border-green-500/20 rounded-xl px-4 py-3"></div>

                <form id="update-form" class="space-y-5">
                    <div>
                        <label for="new-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">New Password</label>
                        <input type="password" id="new-password" required minlength="6"
                            class="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-black/30 border border-gray-300/50 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-solarglyph dark:focus:ring-blue-400 transition-all text-apple-textLight dark:text-apple-textDark"
                            placeholder="••••••••">
                    </div>
                    
                    <div>
                        <label for="confirm-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Confirm Password</label>
                        <input type="password" id="confirm-password" required minlength="6"
                            class="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-black/30 border border-gray-300/50 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-solarglyph dark:focus:ring-blue-400 transition-all text-apple-textLight dark:text-apple-textDark"
                            placeholder="••••••••">
                    </div>

                    <button type="submit" id="update-btn"
                        class="w-full flex items-center justify-center gap-2 bg-solarglyph text-white font-medium px-6 py-3.5 rounded-full hover:shadow-lg hover:shadow-solarglyph/30 hover:-translate-y-px transition-all duration-300">
                        <i data-lucide="loader-2" class="w-4 h-4 spin hidden" id="update-spinner"></i>
                        <span id="update-label">Update Password</span>
                    </button>
                </form>
            </div>

        </div>
    </main>

    <site-footer></site-footer>

    <script src="/shared/site.js"></script>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; }
    </style>
    <script>
        // ---- Supabase config ----
        const SUPABASE_URL = 'https://xuhohaetbviveewgeiub.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_V_h9hhxlQ_xH4WaNZrh9Wg_7Tt0nDbb';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('update-form');
        const errorBox = document.getElementById('form-error');
        const successBox = document.getElementById('form-success');
        const btn = document.getElementById('update-btn');
        const spinner = document.getElementById('update-spinner');
        const label = document.getElementById('update-label');

        function setLoading(isLoading) {
            btn.disabled = isLoading;
            spinner.classList.toggle('hidden', !isLoading);
            label.textContent = isLoading ? 'Updating...' : 'Update Password';
        }

        function showMessage(message, isError) {
            if (isError) {
                errorBox.textContent = message;
                errorBox.classList.remove('hidden');
                successBox.classList.add('hidden');
            } else {
                successBox.textContent = message;
                successBox.classList.remove('hidden');
                errorBox.classList.add('hidden');
            }
        }

        // Check if there is an active session (Supabase handles the URL hash automatically)
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            
            // If there's no session, they probably didn't come from a valid email link
            if (!session) {
                showMessage("Invalid or expired reset link. Please request a new one.", true);
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match.', true);
                return;
            }

            setLoading(true);

            // Update the user's password
            const { data, error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                setLoading(false);
                showMessage(error.message || 'Could not update password. Please try again.', true);
                return;
            }

            // Show success and redirect to dashboard
            showMessage('Password updated successfully! Redirecting...', false);
            
            setTimeout(() => {
                window.location.href = '/Dashboard.html';
            }, 1500);
        });
    </script>
</body>
</html>
